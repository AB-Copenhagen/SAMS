name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

      - name: Audit dependencies (production, high severity+)
        # --omit=dev alone isn't enough to exclude prisma's own devDependency-only `effect`
        # advisory (GHSA-7589-6fvf-x4pw) — confirmed empirically that peer/optional edges in the
        # tree still pull it into the report unless those are omitted too. This combination
        # matches `dependencies.prod` in `npm audit --json`'s own metadata (what's actually
        # shipped), not just everything minus devDependencies.
        run: npm audit --omit=dev --omit=peer --omit=optional --audit-level=high
